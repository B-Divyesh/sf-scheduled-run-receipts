[package]
name = "scheduled-run-receipts"
version = "0.1.0"
edition = "2024"
description = "Local-first signed evidence and absence detection for scheduled jobs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/B-Divyesh/sf-scheduled-run-receipts"
keywords = ["cron", "monitoring", "receipts", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", ".factory/", "e2e/", "scripts/", "package*.json", "playwright.config.ts", "vite.config.ts"]

[[bin]]
name = "srr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
cron = "0.15"
hmac = "0.12"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.21"
